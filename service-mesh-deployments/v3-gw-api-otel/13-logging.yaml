#----------------------------------------------------------------------------------
# OpenShift Logging (ClusterLogForwarder ya existente en openshift-logging).
# No despliega Alloy ni Loki: solo documenta el opt-in por label semaas/namespace.
#----------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openshift-logging
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  source:
    repoURL: https://github.com/nicknas/service-mesh-3-demo.git
    targetRevision: feature/dynatrace-coexistence
    path: service-mesh-deployments/v3-gw-api-otel/helm-charts/logging
