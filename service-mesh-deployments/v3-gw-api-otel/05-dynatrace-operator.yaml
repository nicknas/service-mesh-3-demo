#----------------------------------------------------------------------------------
# Dynatrace Operator — opcional; en clusters BBVA suele estar preinstalado
# (namespace dynatrace-operator, mismo CSV desde catálogo interno Platform Core).
# Este chart usa certified-operators (Red Hat). Solo sincronizar si:
# oc get subscription dynatrace-operator -n dynatrace-operator
# no existe.
#----------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dynatrace-operator
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dynatrace-operator
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://github.com/nicknas/service-mesh-3-demo.git
    targetRevision: main
    path: service-mesh-deployments/v3-gw-api-otel/helm-charts/dynatrace-operator
