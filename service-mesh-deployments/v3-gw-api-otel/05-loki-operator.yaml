#----------------------------------------------------------------------------------
# Installs the Red Hat Loki Operator (redhat-operators)
#----------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-operator
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openshift-operators-redhat
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
  source:
    repoURL: https://github.com/nicknas/service-mesh-3-demo.git
    targetRevision: main
    path: service-mesh-deployments/v3-gw-api-otel/helm-charts/loki-operator
