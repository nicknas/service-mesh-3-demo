# OpenShift Logging is cluster-managed (ClusterLogForwarder "logging" in openshift-logging).
# This chart does NOT install collectors. It only records which namespaces are opted in
# via the label that the existing CLF input "semaas-logs" selects.

# Label key required by ClusterLogForwarder input semaas-logs:
#   matchExpressions: [{ key: semaas/namespace, operator: Exists }]
labelKey: semaas/namespace

# Namespaces that should collect application logs (Bookinfo demo targets).
# Actual labeling is applied to the Namespace object (see bookinfo-application chart
# and/or: oc label namespace <ns> semaas/namespace=<ns>).
namespaces:
  - es-ple-dev
