namespace: logging-system

nameOverride: logging

loki:
  image:
    repository: grafana/loki
    tag: "3.4.2"
    pullPolicy: IfNotPresent
  service:
    port: 3100
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

alloy:
  image:
    repository: grafana/alloy
    tag: "v1.8.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  bookinfo:
    namespace: bookinfo
    apps:
      - productpage
      - reviews
      - details
      - ratings
