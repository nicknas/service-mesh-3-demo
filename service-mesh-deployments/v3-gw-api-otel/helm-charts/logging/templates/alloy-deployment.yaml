apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logging.fullname" . }}-alloy
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "logging.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: alloy
      app.kubernetes.io/name: {{ include "logging.name" . }}
  template:
    metadata:
      labels:
        {{- include "logging.labels" . | nindent 8 }}
        app.kubernetes.io/component: alloy
    spec:
      serviceAccountName: {{ include "logging.fullname" . }}-alloy
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: "{{ .Values.alloy.image.repository }}:{{ .Values.alloy.image.tag }}"
          imagePullPolicy: {{ .Values.alloy.image.pullPolicy }}
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - name: http
              containerPort: 12345
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 473
            runAsGroup: 473
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.alloy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: {{ include "logging.fullname" . }}-alloy-config
        - name: data
          emptyDir: {}
