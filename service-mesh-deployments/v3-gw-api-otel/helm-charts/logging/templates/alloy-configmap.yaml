apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logging.fullname" . }}-alloy-config
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "logging.labels" . | nindent 4 }}
data:
  config.alloy: |
    logging {
      level = "info"
    }

    discovery.kubernetes "bookinfo_pods" {
      role = "pod"
      namespaces {
        names = ["{{ .Values.alloy.bookinfo.namespace }}"]
      }
      selectors {
        role  = "pod"
        label = "app in ({{ include "logging.bookinfoAppSelector" . }})"
      }
    }

    discovery.relabel "bookinfo" {
      targets = discovery.kubernetes.bookinfo_pods.targets

      rule {
        action        = "replace"
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        action        = "replace"
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        action        = "replace"
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        action        = "replace"
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      rule {
        action        = "replace"
        source_labels = ["__meta_kubernetes_pod_label_version"]
        target_label  = "version"
      }
    }

    loki.source.kubernetes "bookinfo" {
      targets    = discovery.relabel.bookinfo.output
      forward_to = [loki.process.bookinfo.receiver]
    }

    loki.process "bookinfo" {
      stage.drop {
        source     = "container"
        expression = "istio-proxy|istio-validation"
      }
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "{{ include "logging.loki.endpoint" . }}"
      }
    }
