apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "logging.fullname" . }}-alloy
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "logging.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "logging.fullname" . }}-alloy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "logging.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "logging.fullname" . }}-alloy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "logging.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "logging.fullname" . }}-alloy
subjects:
  - kind: ServiceAccount
    name: {{ include "logging.fullname" . }}-alloy
    namespace: {{ .Values.namespace }}
