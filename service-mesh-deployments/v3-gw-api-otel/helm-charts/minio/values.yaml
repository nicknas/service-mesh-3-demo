namespace: tracing-system

image:
  repository: quay.io/minio/minio
  tag: RELEASE.2025-04-22T22-12-26Z
  pullPolicy: IfNotPresent

mcImage:
  repository: quay.io/minio/mc
  tag: RELEASE.2025-04-16T18-13-26Z
  pullPolicy: IfNotPresent

auth:
  rootUser: tempo
  rootPassword: tempo12345

# Bucket principal referenciado por el Secret de Tempo
bucket: tempo
buckets:
  - tempo
  - loki

service:
  port: 9000

persistence:
  enabled: true
  size: 5Gi

bucketJob:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  waitAttempts: 60
  waitSeconds: 5
  # Init container: espera /minio/health/ready (no usa mc alias set en bucle)
  waitImage:
    repository: curlimages/curl
    tag: "8.5.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
