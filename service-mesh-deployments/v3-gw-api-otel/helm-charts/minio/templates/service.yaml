apiVersion: v1
kind: Service
metadata:
  name: {{ include "minio.fullname" . }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: {{ include "minio.name" . }}
spec:
  selector:
    app: {{ include "minio.name" . }}
  ports:
    - name: api
      port: {{ .Values.service.port }}
      targetPort: api
