# Activar solo cuando tengas tenant y tokens configurados.
enabled: false

# En clusters BBVA el operador suele estar preinstalado en dynatrace-operator.
namespace: dynatrace-operator

# managed   — patrón BBVA (OneAgent classicFullStack + ActiveGate, Dynatrace Managed)
# saas-ingest — Dynatrace SaaS con telemetryIngest (gateway OTLP in-cluster)
dynaKube:
  apiVersion: dynatrace.com/v1beta4
  mode: managed
  name: dynakube
  apiUrl: ""
  networkZone: ""
  dynatraceApiRequestThreshold: 15

  annotations:
    automaticKubernetesApiMonitoring: true
    oneagentSeccompProfile: ""

  activeGate:
    enabled: true
    replicas: 2
    capabilities:
      - routing
      - kubernetes-monitoring
      - dynatrace-api
    image: ""
    nodeSelector:
      node-role.kubernetes.io/infra: ""
    tolerations:
      - key: node-role.kubernetes.io/infra
        operator: Exists
    resources:
      limits:
        cpu: 1
        memory: 1536Mi
      requests:
        cpu: 100m
        memory: 512Mi

  oneAgent:
    classicFullStack:
      enabled: true
      autoUpdate: false
      image: ""
      nodeSelector:
        dynatraceOneAgent: enabled
      tolerations:
        - key: node-role.kubernetes.io/worker
          operator: Exists
      env:
        - name: DT_SSLVERIFYHOST
          value: "false"
        - name: DT_SSLVERIFYPEER
          value: "false"
      resources:
        limits:
          cpu: 1
          memory: 1536Mi
        requests:
          cpu: 100m
          memory: 512Mi

  metadataEnrichment:
    enabled: false

  telemetryIngest:
    enabled: false
    serviceName: telemetry-ingest
    protocols:
      - otlp
  otelCollector:
    image:
      repository: public.ecr.aws/dynatrace/dynatrace-otel-collector
      tag: "v1.0.0"

secret:
  create: false
  name: dynakube
  apiToken: ""
  dataIngestToken: ""

trustedCA:
  create: false
  name: ca-dynatrace
  certs: ""
