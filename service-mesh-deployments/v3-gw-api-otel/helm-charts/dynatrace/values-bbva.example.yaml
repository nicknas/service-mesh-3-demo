# Patrón Dynatrace Managed en clusters BBVA (referencia: aso1-es-dev).
#
# En la mayoría de clusters BBVA el operador v1.5.1 ya está instalado en
# dynatrace-operator (catálogo Platform Core; mismo bundle Red Hat certificado).
# NO sincronices 05-dynatrace-operator.yaml salvo que falte la Subscription.
#
# 1. Obtener apiToken del equipo de plataforma Dynatrace BBVA.
# 2. Crear Secret (no commitear el token):
#    oc create secret generic dynakube -n dynatrace-operator \
#      --from-literal=apiToken='dt0c01.XXXXXXXX'
# 3. Crear ConfigMap con la CA corporativa (clave certs), o reutilizar ca-dynatrace
#    existente en el namespace.
# 4. Etiquetar nodos worker: oc label node <node> dynatraceOneAgent=enabled
# 5. Sustituir name, apiUrl y networkZone por los de tu cluster/tenant.
# 6. Cambiar enabled a true y sincronizar 14-dynatrace.yaml.

enabled: false

namespace: dynatrace-operator

dynaKube:
  apiVersion: dynatrace.com/v1beta4
  mode: managed
  name: demo-ch-es-work
  apiUrl: "https://dynacmc.work.es.nextgen.igrupobbva/e/8dbf4e82-0132-4e04-a014-3656d5878b09/api"
  networkZone: demo-ch-es-work
  dynatraceApiRequestThreshold: 15

  annotations:
    automaticKubernetesApiMonitoring: true
    oneagentSeccompProfile: ""

  activeGate:
    enabled: true
    replicas: 2
    capabilities:
      - routing
      - kubernetes-monitoring
      - dynatrace-api
    image: dynacmc.work.es.nextgen.igrupobbva/linux/activegate:latest
    nodeSelector:
      node-role.kubernetes.io/infra: ""
    tolerations:
      - key: node-role.kubernetes.io/infra
        operator: Exists
    resources:
      limits:
        cpu: 1
        memory: 1536Mi
      requests:
        cpu: 100m
        memory: 512Mi

  oneAgent:
    classicFullStack:
      enabled: true
      autoUpdate: false
      image: dynacmc.work.es.nextgen.igrupobbva/linux/oneagent:latest
      nodeSelector:
        dynatraceOneAgent: enabled
      tolerations:
        - key: node-role.kubernetes.io/worker
          operator: Exists
      env:
        - name: DT_SSLVERIFYHOST
          value: "false"
        - name: DT_SSLVERIFYPEER
          value: "false"
      resources:
        limits:
          cpu: 1
          memory: 1536Mi
        requests:
          cpu: 100m
          memory: 512Mi

  metadataEnrichment:
    enabled: false

secret:
  create: false
  name: dynakube

trustedCA:
  create: false
  name: ca-dynatrace
