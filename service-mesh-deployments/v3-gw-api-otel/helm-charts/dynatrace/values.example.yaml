# Dynatrace SaaS — telemetryIngest (gateway OTLP in-cluster vía DynaKube).
#
# Requiere operador instalado (05-dynatrace-operator.yaml o preinstalado).
#
# 1. Crear Secret (no commitear tokens):
#    oc create secret generic dynakube -n dynatrace-operator \
#      --from-literal=apiToken='dt0c01.XXXXXXXX' \
#      --from-literal=dataIngestToken='dt0c01.YYYYYYYY'
# 2. Sustituir YOUR_ENV_ID por el ID del tenant Dynatrace SaaS.
# 3. Verificar tag de dynatrace-otel-collector en el registry público de Dynatrace.
# 4. Cambiar enabled a true y sincronizar 14-dynatrace.yaml.

enabled: false

namespace: dynatrace-operator

dynaKube:
  mode: saas-ingest
  name: dynakube
  apiUrl: "https://YOUR_ENV_ID.live.dynatrace.com/api"
  telemetryIngest:
    enabled: true
    serviceName: telemetry-ingest
    protocols:
      - otlp
  otelCollector:
    image:
      repository: public.ecr.aws/dynatrace/dynatrace-otel-collector
      tag: "v1.0.0"
  oneAgent:
    classicFullStack:
      enabled: false

secret:
  create: false
  name: dynakube

trustedCA:
  create: false
