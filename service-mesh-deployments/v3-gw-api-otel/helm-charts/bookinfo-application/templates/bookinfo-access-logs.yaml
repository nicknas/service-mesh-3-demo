# Envoy access logs en stdout (contenedor istio-proxy).
# Nota: el ClusterLogForwarder "logging" excluye istio-proxy; los logs de aplicación
# (contenedores de app) sí se envían a Logstash si el namespace tiene label semaas/namespace.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: access-logs
  namespace: {{ .Values.app.namespace }}
spec:
  accessLogging:
    - providers:
        - name: envoy
