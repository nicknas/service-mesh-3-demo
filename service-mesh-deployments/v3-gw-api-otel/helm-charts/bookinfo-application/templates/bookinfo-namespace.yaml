apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.app.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    istio-discovery: enabled
    istio-injection: enabled
    # Opt-in a ClusterLogForwarder "logging" (input semaas-logs) en openshift-logging
    semaas/namespace: {{ .Values.app.namespace | quote }}

