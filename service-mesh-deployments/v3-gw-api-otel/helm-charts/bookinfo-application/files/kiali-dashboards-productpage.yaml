- name: bookinfo-escenario-ok
  title: Bookinfo — Escenario OK
  discoverOn: istio_requests_total
  items:
    - chart:
        name: "Q1 — Visitas entrantes (RPS)"
        unit: "requests per second"
        spans: 6
        metricName: istio_requests_total
        dataType: rate
        groupLabels:
          - reporter
        aggregations:
          - label: reporter
            displayName: Reporter (inbound = destination)
            singleSelection: true
    - chart:
        name: "Q2 — Tasa de éxito entrante (códigos HTTP)"
        unit: "requests per second"
        spans: 6
        metricName: istio_requests_total
        dataType: rate
        groupLabels:
          - reporter
          - response_code
        aggregations:
          - label: reporter
            displayName: Reporter (inbound = destination)
            singleSelection: true
          - label: response_code
            displayName: HTTP code
    - chart:
        name: "Q3 — Errores entrantes (4xx/5xx)"
        unit: "requests per second"
        spans: 6
        metricName: istio_requests_total
        dataType: rate
        groupLabels:
          - reporter
          - response_code
        aggregations:
          - label: reporter
            displayName: Reporter (inbound = destination)
            singleSelection: true
          - label: response_code
            displayName: HTTP code (filtrar 4xx/5xx)
    - chart:
        name: "Q4 — Latencia p95 entrante"
        unit: "milliseconds"
        spans: 6
        metricName: istio_request_duration_milliseconds_bucket
        dataType: histogram
        groupLabels:
          - reporter
        aggregations:
          - label: reporter
            displayName: Reporter (inbound = destination)
            singleSelection: true
    - chart:
        name: "Q5 — Salida → reviews"
        unit: "requests per second"
        spans: 4
        metricName: istio_requests_total
        dataType: rate
        groupLabels:
          - reporter
          - destination_workload
        aggregations:
          - label: reporter
            displayName: Reporter (outbound = source)
            singleSelection: true
          - label: destination_workload
            displayName: Destino (filtrar reviews-v*)
    - chart:
        name: "Q6 — Salida → details"
        unit: "requests per second"
        spans: 4
        metricName: istio_requests_total
        dataType: rate
        groupLabels:
          - reporter
          - destination_workload
        aggregations:
          - label: reporter
            displayName: Reporter (outbound = source)
            singleSelection: true
          - label: destination_workload
            displayName: Destino (filtrar details-v*)
    - chart:
        name: "Q7 — Salidas por destino"
        unit: "requests per second"
        spans: 4
        metricName: istio_requests_total
        dataType: rate
        groupLabels:
          - reporter
          - destination_workload
        aggregations:
          - label: reporter
            displayName: Reporter (outbound = source)
            singleSelection: true
          - label: destination_workload
            displayName: Destino
    - chart:
        name: "Q8 — Entrada por origen (ingress)"
        unit: "requests per second"
        spans: 12
        metricName: istio_requests_total
        dataType: rate
        groupLabels:
          - reporter
          - source_workload
        aggregations:
          - label: reporter
            displayName: Reporter (inbound = destination)
            singleSelection: true
          - label: source_workload
            displayName: Origen (filtrar istio-ingress*)
- name: bookinfo-escenario-fallo-productpage
  title: Bookinfo — Escenario Fallo (productpage)
  discoverOn: istio_requests_total
  items:
    - chart:
        name: "Q11 — Errores productpage → reviews"
        unit: "requests per second"
        spans: 6
        metricName: istio_requests_total
        dataType: rate
        groupLabels:
          - reporter
          - destination_workload
          - response_code
        aggregations:
          - label: reporter
            displayName: Reporter (outbound = source)
            singleSelection: true
          - label: destination_workload
            displayName: Destino (filtrar reviews-v*)
          - label: response_code
            displayName: HTTP code (filtrar 4xx/5xx)
    - chart:
        name: "Q13 — Latencia p95 productpage"
        unit: "milliseconds"
        spans: 6
        metricName: istio_request_duration_milliseconds_bucket
        dataType: histogram
        groupLabels:
          - reporter
        aggregations:
          - label: reporter
            displayName: Reporter (inbound = destination)
            singleSelection: true
