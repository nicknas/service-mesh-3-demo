subscription:
  channel: alpha
  installPlanApproval: Automatic
  name: dynatrace-operator
  namespace: dynatrace-operator
  # Operador certificado Red Hat (mismo bundle que en clusters BBVA; imágenes en
  # registry.connect.redhat.com/dynatrace/dynatrace-operator).
  source: certified-operators
  sourceNamespace: openshift-marketplace
  # Última versión del canal alpha en certified-operators (cluster demo).
  # Comprobar: oc get packagemanifest dynatrace-operator -n openshift-marketplace \
  #   -o jsonpath='{.status.channels[?(@.name=="alpha")].currentCSV}{"\n"}'
  startingCSV: dynatrace-operator.v1.10.2

# true = OperatorGroup cluster-wide (patrón BBVA); false = solo el namespace del operador
operatorGroup:
  clusterWide: true
