# Dynatrace SaaS en cluster-bbgmb (fan-out OTel → Tempo + Dynatrace).
# No requiere DynaKube ni tenant BBVA Managed.
#
# Antes de sincronizar:
#   oc create secret generic otel-dynatrace-ingest -n istio-system \
#     --from-literal=apiToken='dt0c01.XXXXXXXX'
# Sustituir YOUR_ENV_ID por el ID del tenant SaaS (ej. abc12345).

otel-collector:
  dynatrace:
    enabled: true
    mode: saas
    environmentId: YOUR_ENV_ID
    secret:
      create: false
      name: otel-dynatrace-ingest
