apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
data:
  collector.yaml: |
    extensions:
      bearertokenauth:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
      otlp/tempo:
        endpoint: tempo-tempo-gateway.tracing-system.svc.cluster.local:8090
        tls:
          insecure: false
          insecure_skip_verify: true
        auth:
          authenticator: bearertokenauth
        headers:
          X-Scope-OrgID: "bookinfo"
      {{- if .Values.dynatrace.enabled }}
      otlphttp/dynatrace:
        endpoint: {{ include "otel-collector.dynatrace.endpoint" . | quote }}
        {{- if eq (include "otel-collector.dynatrace.saas" .) "true" }}
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
        {{- end }}
      {{- end }}
    service:
      extensions: [bearertokenauth, health_check]
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [debug, otlp/tempo]
        metrics:
          receivers: [otlp]
          exporters: [debug, otlp/tempo]
        traces:
          receivers: [otlp]
          exporters: [{{ include "otel-collector.traces.exporters" . }}]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
