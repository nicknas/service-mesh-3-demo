# Definimos el colector
kind: OpenTelemetryCollector
apiVersion: opentelemetry.io/v1beta1
metadata:
  name: otel
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  serviceAccount: otel-collector
  observability:
    metrics: {}
  config:
    extensions:
      bearertokenauth:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token
    exporters:
      debug:
        verbosity: detailed
      otlp/tempo:
        endpoint: tempo-tempo-gateway.tracing-system.svc.cluster.local:8090
        tls:
          insecure: false
          insecure_skip_verify: true
        auth:
          authenticator: bearertokenauth
        headers:
          X-Scope-OrgID: "bookinfo"
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: '0.0.0.0:4317'
    service:
      extensions:
        - bearertokenauth
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [debug, otlp/tempo]
        metrics:
          receivers: [otlp]
          exporters: [debug, otlp/tempo]
        traces:
          receivers: [otlp]
          exporters: [debug, otlp/tempo]
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
