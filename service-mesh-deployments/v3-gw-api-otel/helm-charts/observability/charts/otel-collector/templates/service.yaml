# Nombre fijo otel-collector: Istio meshConfig apunta a
# otel-collector.istio-system.svc.cluster.local:4317
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: metrics
      protocol: TCP
