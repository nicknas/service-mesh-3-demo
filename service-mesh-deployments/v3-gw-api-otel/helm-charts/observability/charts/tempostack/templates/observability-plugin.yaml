{{- if .Values.uiPlugin.enabled }}
# Requiere Cluster Observability Operator (UIPlugin CRD). Desactivado por defecto
# en clusters que no permiten instalar operadores nuevos.
apiVersion: observability.openshift.io/v1alpha1
kind: UIPlugin
metadata:
  name: distributed-tracing
spec:
  type: DistributedTracing
{{- end }}
