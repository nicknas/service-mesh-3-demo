# Kiali custom dashboards — alineados con Grafana Bookinfo (Q1–Q13).
# OSSMC/Kiali: máximo 2 filas; spans por fila suman 12 (p. ej. 6+6).
# Latencia: unit=seconds + unitScale=0.001 (ms en Prometheus).
- name: bookinfo-escenario-ok
  title: Bookinfo — Escenario OK
  discoverOn: istio_requests_total
  items:
    - chart:
        name: "Q1 — Visitas entrantes (RPS)"
        chartType: line
        unit: "requests per second"
        spans: 6
        metricName: istio_requests_total
        dataType: rate
    - chart:
        name: "Q4 — Latencia p95 entrante"
        chartType: line
        unit: seconds
        unitScale: 0.001
        spans: 6
        metricName: istio_request_duration_milliseconds
        dataType: histogram
    - chart:
        name: "Q2/Q3 — Códigos HTTP entrantes"
        chartType: line
        unit: "requests per second"
        spans: 6
        metricName: istio_requests_total
        dataType: rate
        aggregations:
          - label: response_code
            displayName: HTTP code
    - chart:
        name: "Q7 — Salidas por destino"
        chartType: line
        unit: "requests per second"
        spans: 6
        metricName: istio_requests_total
        dataType: rate
        aggregations:
          - label: destination_workload
            displayName: Destino
# Escenario fallo diseñado: ratings caído (oc scale ratings-v1 --replicas=0).
# No borrar el pod (se recrea rápido). Errores = flag UH en salida hacia ratings.
# Con v1/v2/v3 activos, solo ~1/3 del tráfico llega a cada workload.
- name: bookinfo-escenario-fallo-reviews
  title: Bookinfo — Escenario Fallo (ratings caído)
  rows: 1
  discoverOn: istio_requests_total
  items:
    - chart:
        name: "Q9 — Flags (buscar UH)"
        chartType: line
        unit: "requests per second"
        spans: 6
        metricName: istio_requests_total
        dataType: rate
        groupLabels:
          - response_flags
    - chart:
        name: "Q10 — Códigos HTTP"
        chartType: line
        unit: "requests per second"
        spans: 6
        metricName: istio_requests_total
        dataType: rate
        groupLabels:
          - response_code
# Kiali no admite filtros PromQL (p. ej. response_code=~"4..|5.."); Q11 solo en Grafana.
- name: bookinfo-escenario-fallo-productpage
  title: Bookinfo — Escenario Fallo (productpage)
  discoverOn: istio_requests_total
  items:
    - chart:
        name: "Q13 — Latencia p95 productpage"
        chartType: line
        unit: seconds
        unitScale: 0.001
        spans: 12
        metricName: istio_request_duration_milliseconds
        dataType: histogram
