# Fan-out OTel Collector: Tempo + Dynatrace SaaS (modo directo, sin DynaKube).
#
# NO requiere Applications dynatrace-operator ni 14-dynatrace.yaml.
#
# 1. Token en Dynatrace con scope openTelemetryTrace.ingest
# 2. Crear Secret (no commitear el token):
#    oc create secret generic otel-dynatrace-ingest -n istio-system \
#      --from-literal=apiToken='dt0c01.XXXXXXXX'
# 3. Sustituir YOUR_ENV_ID por el ID del tenant (sin .live.dynatrace.com)
# 4. En Argo CD (Application 11-observability.yaml):
#      source.helm.valueFiles:
#        - values-dynatrace.example.yaml

otel-collector:
  dynatrace:
    enabled: true
    mode: saas
    environmentId: YOUR_ENV_ID
    secret:
      create: false
      name: otel-dynatrace-ingest
