apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-dashboard-bookinfo
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  bookinfo-istio.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{namespace=\"bookinfo\", destination_workload=~\"productpage.*\", reporter=\"destination\"}[5m]))",
              "legendFormat": "productpage inbound",
              "refId": "A"
            }
          ],
          "title": "Productpage — visitas entrantes (RPS)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{namespace=\"bookinfo\", destination_workload=~\"productpage.*\", reporter=\"destination\", response_code=~\"2..\"}[5m])) / sum(rate(istio_requests_total{namespace=\"bookinfo\", destination_workload=~\"productpage.*\", reporter=\"destination\"}[5m]))",
              "legendFormat": "success rate",
              "refId": "A"
            }
          ],
          "title": "Productpage — tasa de éxito",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{namespace=\"bookinfo\", source_workload=~\"productpage.*\", reporter=\"source\"}[5m])) by (destination_workload)",
              "legendFormat": "{{ "{{" }}destination_workload{{ "}}" }}",
              "refId": "A"
            }
          ],
          "title": "Productpage — salidas por destino",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{namespace=\"bookinfo\", source_workload=~\"reviews.*\", destination_workload=~\"ratings.*\", reporter=\"source\"}[5m])) by (response_code)",
              "legendFormat": "{{ "{{" }}response_code{{ "}}" }}",
              "refId": "A"
            }
          ],
          "title": "Reviews → ratings (por código HTTP)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "id": 5,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{namespace=\"bookinfo\", destination_workload=~\"productpage.*\", reporter=\"destination\"}[5m])) by (le))",
              "legendFormat": "p95 latency",
              "refId": "A"
            }
          ],
          "title": "Productpage — latencia p95",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["bookinfo", "istio", "service-mesh"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "title": "Bookinfo / Service Mesh",
      "uid": "bookinfo-istio",
      "version": 1
    }
