apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-dashboard-bookinfo-logs
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  bookinfo-logs.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "options": {
            "content": "**Bookinfo logs** — stdout/stderr de productpage, reviews, details y ratings (namespace `bookinfo`). Filtra por servicio y versión. Desde Tempo puedes saltar a logs relacionados con una traza.",
            "mode": "markdown"
          },
          "title": "Bookinfo logs",
          "type": "text"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 18, "w": 24, "x": 0, "y": 3 },
          "id": 1,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "expr": "{namespace=\"bookinfo\", app=~\"$app\", version=~\"$version\"} |= \"$search\"",
              "refId": "A"
            }
          ],
          "title": "Application logs",
          "type": "logs"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["bookinfo", "logs", "loki"],
      "templating": {
        "list": [
          {
            "current": { "selected": true, "text": "All", "value": ".*" },
            "hide": 0,
            "includeAll": false,
            "label": "Service",
            "multi": false,
            "name": "app",
            "options": [
              { "selected": true, "text": "All", "value": ".*" },
              { "selected": false, "text": "productpage", "value": "productpage" },
              { "selected": false, "text": "reviews", "value": "reviews" },
              { "selected": false, "text": "details", "value": "details" },
              { "selected": false, "text": "ratings", "value": "ratings" }
            ],
            "query": ".*,productpage,reviews,details,ratings",
            "type": "custom"
          },
          {
            "current": { "selected": true, "text": "All", "value": ".*" },
            "datasource": { "type": "loki", "uid": "loki" },
            "definition": "label_values({namespace=\"bookinfo\"}, version)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "label": "Version",
            "multi": false,
            "name": "version",
            "query": "label_values({namespace=\"bookinfo\"}, version)",
            "refresh": 2,
            "regex": "",
            "type": "query"
          },
          {
            "current": { "selected": false, "text": "", "value": "" },
            "hide": 0,
            "label": "Search",
            "name": "search",
            "options": [{ "selected": true, "text": "", "value": "" }],
            "query": "",
            "type": "textbox"
          }
        ]
      },
      "time": { "from": "now-15m", "to": "now" },
      "title": "Bookinfo — Logs",
      "uid": "bookinfo-logs",
      "version": 1
    }
