apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-dashboard-bookinfo-ok
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  bookinfo-escenario-ok.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "title": "Escenario Fallo",
          "type": "dashboard",
          "url": "/d/bookinfo-fallo",
          "icon": "bolt"
        }
      ],
      "panels": [
        {
          "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "options": {
            "content": "**Escenario OK** — Todo funciona. Genera tráfico con F5 en `/productpage` o `./utils/generate-traffic.sh 20`. Métricas correlacionadas con Kiali → Traffic / Inbound / Outbound Metrics.",
            "mode": "markdown"
          },
          "title": "Escenario OK",
          "type": "text"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Q1 — Visitas entrantes a productpage",
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 3 },
          "id": 1,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{namespace=\"bookinfo\", destination_workload=~\"productpage.*\", reporter=\"destination\"}[5m]))",
              "legendFormat": "productpage inbound",
              "refId": "A"
            }
          ],
          "title": "Q1 — Visitas entrantes (RPS)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Q2 — Tasa de éxito entrante",
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 3 },
          "id": 2,
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{namespace=\"bookinfo\", destination_workload=~\"productpage.*\", reporter=\"destination\", response_code=~\"2..\"}[5m])) / sum(rate(istio_requests_total{namespace=\"bookinfo\", destination_workload=~\"productpage.*\", reporter=\"destination\"}[5m]))",
              "legendFormat": "success rate",
              "refId": "A"
            }
          ],
          "title": "Q2 — Tasa de éxito entrante",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Q3 — Errores entrantes (debe estar vacío en escenario OK)",
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 11 },
          "id": 3,
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{namespace=\"bookinfo\", destination_workload=~\"productpage.*\", reporter=\"destination\", response_code!~\"2..\"}[5m])) by (response_code)",
              "legendFormat": "{{ "{{" }}response_code{{ "}}" }}",
              "refId": "A"
            }
          ],
          "title": "Q3 — Errores entrantes (por código HTTP)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Q4 — Latencia p95 entrante",
          "fieldConfig": { "defaults": { "unit": "ms" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 11 },
          "id": 4,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{namespace=\"bookinfo\", destination_workload=~\"productpage.*\", reporter=\"destination\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ],
          "title": "Q4 — Latencia p95 entrante",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Q5 — Salida productpage → reviews",
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 19 },
          "id": 5,
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{namespace=\"bookinfo\", source_workload=~\"productpage.*\", destination_workload=~\"reviews.*\", reporter=\"source\"}[5m]))",
              "legendFormat": "productpage → reviews",
              "refId": "A"
            }
          ],
          "title": "Q5 — Salida → reviews",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Q6 — Salida productpage → details",
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 19 },
          "id": 6,
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{namespace=\"bookinfo\", source_workload=~\"productpage.*\", destination_workload=~\"details.*\", reporter=\"source\"}[5m]))",
              "legendFormat": "productpage → details",
              "refId": "A"
            }
          ],
          "title": "Q6 — Salida → details",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Q7 — Todas las salidas de productpage",
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 19 },
          "id": 7,
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{namespace=\"bookinfo\", source_workload=~\"productpage.*\", reporter=\"source\"}[5m])) by (destination_workload)",
              "legendFormat": "{{ "{{" }}destination_workload{{ "}}" }}",
              "refId": "A"
            }
          ],
          "title": "Q7 — Salidas por destino",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Q8 — Entrada desde ingress (target B: por source_workload si ingress no aparece)",
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 27 },
          "id": 8,
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{namespace=\"bookinfo\", destination_workload=~\"productpage.*\", reporter=\"destination\", source_workload=~\"istio-ingress.*\"}[5m]))",
              "legendFormat": "desde ingress",
              "refId": "A"
            },
            {
              "expr": "sum(rate(istio_requests_total{namespace=\"bookinfo\", destination_workload=~\"productpage.*\", reporter=\"destination\"}[5m])) by (source_workload)",
              "legendFormat": "{{ "{{" }}source_workload{{ "}}" }}",
              "refId": "B"
            }
          ],
          "title": "Q8 — Entrada desde ingress / por origen",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["bookinfo", "istio", "service-mesh", "escenario-ok"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "title": "Bookinfo — Escenario OK",
      "uid": "bookinfo-ok",
      "version": 1
    }
