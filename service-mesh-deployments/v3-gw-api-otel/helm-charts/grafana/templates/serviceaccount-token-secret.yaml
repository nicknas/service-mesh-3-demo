# Token for GrafanaDatasource Authorization header (Thanos Querier / Tempo gateway).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana.fullname" . }}-sa-token
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    kubernetes.io/service-account.name: {{ include "grafana.fullname" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
type: kubernetes.io/service-account-token
