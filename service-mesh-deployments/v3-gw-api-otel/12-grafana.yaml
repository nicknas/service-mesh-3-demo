#----------------------------------------------------------------------------------
# Deploys Grafana with Prometheus and Tempo datasources (sync after observability)
#----------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: grafana-system
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://github.com/nicknas/service-mesh-3-demo.git
    targetRevision: main
    path: service-mesh-deployments/v3-gw-api-otel/helm-charts/grafana
